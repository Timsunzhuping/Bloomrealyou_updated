# -----------------------------------------------------------------------------
# Bloomrealyou — production-style Docker Compose (example).
#
# Copy to docker-compose.prod.yml, fill secrets, and bring up with:
#
#   docker compose -f docker-compose.prod.yml up -d
#
# Each app is built from the repo root (build context `.`). The Postgres /
# Redis / MinIO services match the dev compose file but use named volumes
# you should back up. For real production, run Postgres / Redis / object
# storage outside Docker (RDS, ElastiCache, S3) and only deploy the apps.
# -----------------------------------------------------------------------------

x-env-defaults: &env-defaults
  NODE_ENV: production
  TZ: UTC

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?missing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing}
      POSTGRES_DB: ${POSTGRES_DB:-bloomrealyou}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--save', '60', '1', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?missing}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?missing}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: bloomrealyou/api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      <<: *env-defaults
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bloomrealyou}?schema=public
      REDIS_URL: redis://redis:6379
      IDEMPOTENCY_STORE_BACKEND: redis
      NOTIFICATIONS_QUEUE_DRIVER: bullmq
      BULLMQ_REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-bloomrealyou-uploads}
      JWT_SECRET: ${JWT_SECRET:?missing}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_WEBHOOK_REQUIRE_SIGNATURE: 'true'
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER:-mock}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      SHIPPING_PROVIDER: ${SHIPPING_PROVIDER:-mock}
      EASYPOST_API_KEY: ${EASYPOST_API_KEY}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS}
    ports:
      - '${API_PORT:-4000}:4000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${API_URL:?missing}
        NEXT_PUBLIC_DEFAULT_LOCALE: ${NEXT_PUBLIC_DEFAULT_LOCALE:-en}
    image: bloomrealyou/web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      <<: *env-defaults
      NEXT_PUBLIC_API_BASE_URL: ${API_URL}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
    ports:
      - '${WEB_PORT:-3000}:3000'

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_ADMIN_API_BASE_URL: ${API_URL:?missing}
    image: bloomrealyou/admin:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      <<: *env-defaults
      NEXT_PUBLIC_ADMIN_API_BASE_URL: ${API_URL}
    ports:
      - '${ADMIN_PORT:-3001}:3001'

volumes:
  postgres-data:
  redis-data:
  minio-data:
